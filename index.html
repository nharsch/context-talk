# Context Engineering

### What is an Agent, Really?

--

## What is "context"?

**Everyday usage:** the circumstances that form the setting for an event or idea

**For LLMs:** the set of tokens included when sampling from the model

Quality context is important for making high quality decisions — with or without an agent.

The model has training data baked into its weights — that's baseline knowledge.

The context window is what **steers, supplements, and overrides** that knowledge at inference time.

---

<!-- .slide: class="center" -->
# What is an Agent?

--

## An LLM is a function

```
// as a pure function
f(query) → response

// in reality, somewhat random based on temp param
f(query, temperature, randomSeed) → response
```

- Stateless. No memory.
- Cannot _do_ antyhing.
- It receives text. It returns text. That's it.

--

## "Chat" is an illusion

```
f(chatHistory + newQuery) → response
```

Every turn, the **harness** replays the full conversation back to the model.

The model doesn't "remember" — it re-reads everything.

Every message **fills up** the context window. Eventually, you hit the ceiling.

Thus, the "context window" (the maximum query length of the underlying model) must be _managed_

--

## How to manage the context window: The Harness

The harness makes a model an agent

ChatGPT, Claude (chat, Code, Cowork), Cursor, Copilot, they all:

- Write the system prompt
- Choose which tools to expose
- Handle tool calling
- Manage memory and context
- Decide what fits in the window

--

<!-- .slide: data-background-color="#f5f3ee" -->

## The agent harness interacts with the outside world

![The Harness](harness.png) <!-- .element: style="max-height: 55vh; max-width: 80vw; object-fit: contain;" -->

--

## Examples of context you don't see

- **System prompt** — instructions injected before your first message
- **Thinking / reasoning traces** — the model's internal chain-of-thought
- **Tool call invocations** — the model asking to run a tool
- **Tool call responses** — results returned from the tool
- **Injected context** — retrieved docs, memory, skill specs loaded by the harness
- **Prior conversation summaries** — compacted history replacing older messages

All of this is in the context window. You just don't see it in the chat UI.

--

## What an LLM response actually looks like

```json
[
  { "type": "thinking",
    "text": "The user wants to know about the deploy.
     Let me check the CI pipeline status..." },

  { "type": "tool_use",
    "name": "bash",
    "input": "git log --oneline -5" },

  { "type": "tool_result",
    "output": "a1b2c3d fix: resolve timeout\n..." },

  { "type": "tool_use",
    "name": "redmine_get_issue",
    "input": { "issue_id": 14930 } },

  { "type": "tool_result",
    "output": "{ status: 'In QA', assignee: ... }" },

  { "type": "text",
    "text": "The deploy looks good — here's
     what changed..." }
]
```

The user only sees the last one. <!-- .element: class="accent" -->

--

<!-- .slide: class="center" -->
# Context is a Finite Resource

--

## The window has limits

The context window is the **only thing the model can see**.

More tokens in the window → worse recall.

Context is a **finite resource with diminishing returns**.

--

<!-- .slide: class="center" data-background-color="#ffffff" -->

![Needle in a Haystack — Claude 2.1](needle-haystack.png) <!-- .element: style="max-height: 55vh; max-width: 80vw; object-fit: contain;" -->

<!-- .element: class="small" -->
Greg Kamradt's needle-in-a-haystack benchmark — Claude 2.1 (200K context)

--

## Context Patterns

What to include. What to leave out. When to load it.

--

## Pattern: Tool Calling

The model can't act on the world — but the harness can.

The model outputs a structured **request** to use a tool. The harness executes it and returns the result.

- Read a file
- Run a shell command
- Query an API
- Search a database

Every tool result becomes **new context** in the window.

--

## Pattern: Progressive Disclosure

Load context **just-in-time**, not all upfront.

Example: Claude Code **skills** — a skill spec is only loaded when invoked, not sitting in the system prompt permanently.

You don't dump the whole manual. You hand over the right page.

--

<!-- .slide: class="center" data-background-image="i_know_kung_fu.jpg" data-background-size="contain" data-background-color="#000" -->

--

## Pattern: Memory

Structured notes **persisted outside the window**.

Pulled back in when relevant.

The agent writes things down so it can forget safely.

How does the model know what's available?
- **Always loaded** — short index injected into system prompt every turn
- **Searched at inference** — harness searches a vector DB based on current query (RAG)
- **Tool-based** — model has a "search memory" tool it can call on demand

--

## Pattern: Compaction

Summarize older context to fit the window.

Lossy, but better than hitting the ceiling.

--

## Pattern: Multi-Agent

Each sub-agent gets its own **fresh window**.

Sub-agents only surface relevant _distilled_ context back to main agent

---

<!-- .slide: class="center" -->
# Good Context Sources

--

## Not all sources are equal

What makes a <span class="good">good</span> context source?

- **Addressable** — URL, file path. Multiple agents can point to it.
- **Persistent** — Still there tomorrow.
- **Queryable** — Supports search (lexical, semantic) and/or logical queries (SQL, Graph queries)
- **Time-indexed / Change tracking** — You can ask "what changed?"

--

## What makes a <span class="bad">bad</span> source?

- Ephemeral
- Vague
- Inaccessible

--

## Examples scored

| Source | Addressable | Persistent | Queryable | Change Tracking |
|--------|:-:|:-:|:-:|:-:|
| Git repo | ✅ | ✅ | ✅ | ✅ |
| Redmine ticket | ✅ | ✅ | ✅ | ✅ |
| Slack thread | ✅ | ✅ | ⚠️ | ⚠️ |
| Google Doc | ✅ | ⚠️ | ⚠️ | ⚠️ |
| Shared File | ⚠️ | ⚠️ | ❌ | ❌ |
| Meeting notes | ❌ | ❌ | ⚠️ | ❌ |


---

<!-- .slide: class="center" -->
# Building good context sources

--

## Obsidian as context home

A vault of wikilinked notes that **point agents to the right sources**.

- Project notes link to tickets, Slack channels, docs
- Skills define how to use each tool
- You get **visibility** into what the agent knows
- And **control** over how it discovers context

--

## MCPs

**Model Context Protocol** makes non-native sources accessible.

Redmine, Slack, Grafana, databases —
wrapped in structured, queryable tools the agent can call.

The source doesn't have to be LLM-native.
It just needs a good interface. (Addressable, Queryable, Change Tracking)

--

## Knowledge Bases

- RAG: Vector DBs supporting semantic search
- GraphRAG / Knowledge Graphs: Graph DBs encode entities and relationships
- Wikis: Indexes and contextural links
- Mixtures of the above

Again: Addressable, Persistent, Queryable, Change tracking

--

## The Ideal "Live" Context Source

1. **An ordered log of factual changes**
   Events, diffs, assertions — in time

2. **A queryable view derived from that log**
   Current state as a projection

--

## Agents could have these properties too:

from [The Log is the Agent](https://arxiv.org/pdf/2605.21997)

<!-- .slide: class="center" data-background-color="#ffffff" -->

![Log → Graph → Behaviors](log_is_agent_detail.png) <!-- .element: style="max-height: 85vh;" -->

--

## This pattern works

**Git** Commit log → working tree.

**Databases** Write-ahead log → tables.

**Redux** Action log → state.

**Event Sourcing** streams of events -> parallel stateful views

--

## The takeaway

When choosing where to put information, ask:

- Can an agent **read** it?
- Can it see what **changed**?
- Can it **query** it?
